# pytorch_lightning: : 2.1.0
seed_everything: 42
trainer:
  accelerator: auto
  strategy: auto
  devices: auto
  num_nodes: 1
  precision: null
  logger: null
  callbacks: null
  fast_dev_run: false
  max_epochs: null
  min_epochs: null
  max_steps: 100000
  min_steps: null
  max_time: null
  limit_train_batches: null
  limit_val_batches: null
  limit_test_batches: null
  limit_predict_batches: null
  overfit_batches: 0.0
  val_check_interval: null
  check_val_every_n_epoch: 1
  num_sanity_val_steps: 0
  log_every_n_steps: null
  enable_checkpointing: null
  enable_progress_bar: null
  enable_model_summary: null
  accumulate_grad_batches: 1
  gradient_clip_val: null
  gradient_clip_algorithm: null
  deterministic: null
  benchmark: null
  inference_mode: true
  use_distributed_sampler: true
  profiler: null
  detect_anomaly: false
  barebones: false
  plugins: null
  sync_batchnorm: false
  reload_dataloaders_every_n_epochs: 0
  default_root_dir: null
model:
  encoder_pair: MusCALL
  scheduler_name: cvssp/audioldm2
  scheduler_pred_type: sample
  encoder_pair_kwargs:
    config: diffgar/models/muscall/configs/models/muscall.yaml
    ckpt_path: s3://maml-aimcdt/storage/julien/MusCALL/best_model.pth.tar
  preextracted_latents: true
data:
  task: 'song_describer'
  task_kwargs:
    data_path: /opt/ml/processing/input
    csv_path: s3://maml-aimcdt/datasets/song-describer/data/song_describer.csv
  preextracted_features: false
  truncate_preextracted: 64
  batch_size: 32
  num_workers: 4
  target_sr: 16000
  target_n_samples: 319999
save_dir: /opt/ml/processing/output/muscall/npy/1hz
root_path: /opt/ml/processing/input
extract_method: extract_features
out_key: projected_features
hop: 16000
limit_n: null
save: false
