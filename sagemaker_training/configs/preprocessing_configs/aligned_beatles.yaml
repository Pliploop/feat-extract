
base_name: diffgar-extract
pull_config: s3://maml-aimcdt/datasets/embeddings/aligned_beatles/preprocessing_config.yaml
processing_inputs:
  - source: s3://maml-datasets/umg-spotify-most-popular-songs/v1.0/audio/
    input_name: audio
    destination: /opt/ml/processing/input
processing_outputs:
  - destination: s3://maml-aimcdt/datasets/embeddings/spotify_most_popular
    output_name: npy
    source: /opt/ml/processing/output
processor:
  image_uri: 427750820708.dkr.ecr.us-east-1.amazonaws.com/julien_extract_features:latest
  instance_count: 5
  role: maml-aimcdt-sagemaker
  instance_type: ml.g5.2xlarge
  volume_size_in_gb: 250
  entrypoint: [python, -m, extract_dataset, --config, s3://maml-aimcdt/datasets/embeddings/spotify_most_popular/preprocessing_config.yaml]
  tags:
    - Key: Project
      Value: maml-feature-extraction
    - Key: Application-Name
      Value: MAML