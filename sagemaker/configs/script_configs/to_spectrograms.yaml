
base_name: diffgar-extract
processing_inputs:
  - source: s3://maml-datasets/mtg-jamendo/audio/
    input_name: audio
    destination: /opt/ml/processing/input
processing_outputs:
  - destination: s3://maml-aimcdt/datasets/music_dynamics_key/estimated/embeddings
    output_name: npy
    source: /opt/ml/processing/output
processor:
  image_uri: 427750820708.dkr.ecr.us-east-1.amazonaws.com/julien_simple_scripts:latest
  instance_count: 9
  role: maml-aimcdt-sagemaker
  instance_type: ml.g5.4xlarge
  volume_size_in_gb: 600
  entrypoint: [python, -m, scripts/to_spectrogram]
  tags:
    - Key: Project
      Value: maml-feature-extraction
    - Key: Application-Name
      Value: MAML